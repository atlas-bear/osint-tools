project:
  type: website
  output-dir: _site
  render:
    - "*.md"
    - "*.qmd"

website:
  title: "Maritime and Supply Chain OSINT Tools"
  description: "A curated, verified list of maritime and supply-chain OSINT tools and data sources, by AB//LABS."
  site-url: https://library.ab-labs.io/osint-tools/
  repo-url: https://github.com/atlas-bear/osint-tools
  repo-subdir: docs
  repo-actions: [edit, issue]
  favicon: favicon.svg
  image: social.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  search: false
  navbar:
    title: "OSINT Tools"
    left:
      - text: Browse
        href: browse.qmd
    right:
      - text: Library
        href: https://library.ab-labs.io/
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - text: Start here
        href: index.md
      - browse.qmd
      - section: Tracking and identity
        contents:
          - 01-vessel-tracking.md
          - ais-data-note.md
          - 02-vessel-identity.md
          - 03-ownership-sanctions.md
      - section: Imagery, places and cargo
        contents:
          - 04-satellite-imagery.md
          - 05-ports-infrastructure.md
          - 06-cargo-trade.md
          - 07-incidents-security.md
          - 08-maps-weather-charts.md
      - section: Platforms, tools and learning
        contents:
          - 09-commercial-platforms.md
          - 10-utilities-code.md
          - 11-learning.md
      - glossary.md
      - archive.md
      - contributing.md
      - about.md
  page-footer:
    left: "Copyright 2024-2026 AB//LABS (formerly Atlas|Bear Labs). List and data files licensed MIT. Each tool has its own terms."
    right:
      - text: Library
        href: https://library.ab-labs.io/
      - text: ab-labs.io
        href: https://ab-labs.io
      - text: Contact
        href: mailto:support@ab-labs.io

format:
  atlas-bear/theme-html:
    include-after-body:
      text: '<script src="repo-stats.js" data-repo="atlas-bear/osint-tools"></script><script src="library-search.js" data-source="tools"></script>'
    toc-depth: 2
