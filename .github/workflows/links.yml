name: Check links

on:
  pull_request:
    paths: ["**/*.md"]
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: ${{ github.event_name == 'pull_request' }}
          format: markdown
          output: lychee/out.md
          args: >-
            --no-progress --accept 200,202,206,429 --max-concurrency 8 --timeout 30
            "docs/**/*.md" CHANGELOG.md CONTRIBUTING.md COMMUNITY_GUIDELINES.md
      - name: Find the open link-check issue
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "number=$(gh issue list --label link-check --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
      - name: Open or update the link-check issue
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Link check report
          content-filepath: lychee/out.md
          issue-number: ${{ steps.issue.outputs.number }}
          labels: link-check
