site_name: Maritime and Supply Chain OSINT Tools
site_description: A curated, verified list of maritime and supply-chain OSINT tools and data sources, by Atlas Bear Labs
site_url: https://atlas-bear.github.io/osint-tools/
repo_url: https://github.com/atlas-bear/osint-tools
repo_name: atlas-bear/osint-tools
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024-2026 Atlas Bear. List and data files licensed MIT. Each tool has its own terms.

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Start here: index.md
  - Vessel tracking (AIS): 01-vessel-tracking.md
  - Who owns the AIS data: ais-data-note.md
  - Vessel identity and inspections: 02-vessel-identity.md
  - Ownership, sanctions and shadow fleet: 03-ownership-sanctions.md
  - Satellite imagery and detection: 04-satellite-imagery.md
  - Ports, chokepoints and infrastructure: 05-ports-infrastructure.md
  - Cargo, containers and trade data: 06-cargo-trade.md
  - Security incidents and warnings: 07-incidents-security.md
  - Maps, weather and charts: 08-maps-weather-charts.md
  - Commercial platforms: 09-commercial-platforms.md
  - Utilities, code and our tools: 10-utilities-code.md
  - Learning and reference: 11-learning.md
  - Glossary: glossary.md
  - Archive: archive.md
  - Contributing: contributing.md
  - About, licence and contact: about.md
  - AI-Enhanced OSINT guide: https://atlas-bear.github.io/osint-ai-guide/
  - Atlas Bear Library: https://atlas-bear.github.io/

extra:
  social:
    - icon: material/home
      link: https://atlas-bear.github.io/
      name: Atlas Bear Library
    - icon: material/github
      link: https://github.com/atlas-bear
      name: Atlas Bear Labs on GitHub

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

strict: true
